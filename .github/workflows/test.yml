name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rust backend tests and checks
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend (required for Tauri context)
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --verbose

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Frontend linting and type checking
  frontend-check:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Check TypeScript/Svelte types
        run: npm run check

  # Secret scan over the commits a PR or push adds. gitleaks runs from a
  # SHA256-verified release binary, so the job needs no third-party action
  # and also runs on bot PRs.
  secrets:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        # A version bump also needs the new GITLEAKS_SHA256, from the
        # release's gitleaks_<version>_checksums.txt.
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check the config detects a planted key
        # An .gitleaks.toml with only an [allowlist] loads zero rules and
        # reports "no leaks found" on anything. Scan a generated AWS-shaped
        # key with the repo config; exit code 3 means it was detected.
        # GITLEAKS_CONFIG makes this check and the scan load the same file.
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ]; then
            echo "GITLEAKS_CONFIG=$PWD/.gitleaks.toml" >> "$GITHUB_ENV"
            export GITLEAKS_CONFIG="$PWD/.gitleaks.toml"
          fi
          d="$RUNNER_TEMP/gitleaks-canary"
          mkdir -p "$d"
          rand=$(head -c 20 /dev/urandom | base32)
          printf 'aws_access_key_id = "AKIA%s"\n' "${rand:0:16}" > "$d/canary.env"
          rc=0
          gitleaks dir "$d" --no-banner --redact --exit-code 3 >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "::error file=.gitleaks.toml::the gitleaks config detected nothing (exit $rc); add [extend] useDefault = true"
            exit 1
          fi

      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              range="origin/${BASE_REF}..HEAD" ;;
            push)
              if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                range="${BEFORE_SHA}..HEAD"
              else
                range="HEAD~1..HEAD"
              fi ;;
            *)
              range="HEAD" ;;
          esac
          echo "Scanning ${range}"
          gitleaks git --no-banner --redact --log-opts="${range}" .

  # Playwright E2E tests with replay mode
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CLEANSCOPE_REPLAY_PATH: src-tauri/tests/fixtures
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 30
