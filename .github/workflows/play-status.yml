name: Play Store Status

# Weekly snapshot of the Google Play publishing state and upcoming policy
# deadlines. Fails when the Play API rejects the service account, so a lost
# Play Console permission surfaces here instead of at the next release.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: play-status
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  status:
    name: Play Store status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Collect Play status
        run: uv run scripts/play_status.py --summary "$GITHUB_STEP_SUMMARY" > play-status.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Upload status JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-status
          path: play-status.json
          retention-days: 90
